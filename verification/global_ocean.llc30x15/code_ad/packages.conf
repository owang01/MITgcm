#-- list of packages (or group of packages) to compile for this experiment:
#-- LLC30 lightweight verification config (see docs/plans/
#   20261103-llc30-lightweight-verification-config.md, Task 4).
#   "gfd" is the default package group (mom_common/mom_fluxform/mom_vecinv/
#   generic_advdiff/debug/mdsio/rw/monitor) -- required explicitly here
#   because genmake2 uses this file *instead of* default_pkg_list once it
#   exists, so omitting "gfd" silently drops mdsio/rw/monitor/mom_common
#   etc. and ini_curvilinear_grid.F aborts with "Needs to compile MDSIO pkg".
#   "ggl90" (not "kpp") is used for vertical mixing. cs32x15/code/ ships
#   GGL90_OPTIONS.h (and no KPP_OPTIONS.h) unconditionally, confirming ggl90
#   is cs32x15's convention at the code/ level -- but note cs32x15's own
#   BASE input/data.pkg does NOT set useGGL90=.TRUE. (tRef/sRef-only
#   PARM01, no KPP/GGL90-specific settings); only its input.in_p/data.pkg
#   variant actually enables useGGL90=.TRUE.. This config enables useGGL90
#   directly in its base data.pkg, a legitimate choice on its own merits,
#   but it should not be read as "matching" cs32x15's base data.pkg, which
#   it does not. Per Non-Goals, ecco/ctrl/autodiff are NOT enabled.
#-- Phase A (docs/plans -- adjoint-experiment plan, see HANDOFF.md):
#   expanded to match real V4r6's full forward package list minus sbo
#   (gmredi, seaice, shelfice, steep_icecavity [STIC -- NOT icefront,
#   see HANDOFF.md's STIC rationale], salt_plume, diagnostics). sbo is
#   explicitly dropped per user decision.
#-- Phase B (this code_ad/ dir): adds the real adjoint stack on top of
#   Phase A's forward package list -- autodiff/cost/ctrl/grdchk (the
#   standard "adjoint" group, pkg/pkg_groups) plus ecco/profiles/smooth,
#   matching real V4r6's own full package list (minus sbo) exactly.
exch2
gfd
exf
cal
ggl90
gmredi
seaice
shelfice
steep_icecavity
salt_plume
diagnostics

